<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Synthetic Merchant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #020817;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 24px 16px;
    }

    .container { max-width: 720px; margin: 0 auto; }

    /* Header */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #0f172a; border: 1px solid #1f2937;
      border-radius: 30px; padding: 4px 14px;
      font-size: 11px; color: #64748b; margin-bottom: 12px;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #10b981;
    }
    h1 {
      font-size: clamp(22px, 5vw, 34px); font-weight: 800;
      background: linear-gradient(135deg, #00d4ff, #a855f7, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.2; margin-bottom: 6px;
    }
    .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }

    /* Input Card */
    .card {
      background: #0f172a; border: 1px solid #1f2937;
      border-radius: 14px; padding: 18px; margin-bottom: 16px;
    }
    label { color: #94a3b8; font-size: 12px; display: block; margin-bottom: 8px; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1; background: #020817; border: 1px solid #1f2937;
      border-radius: 9px; padding: 11px 14px;
      color: #f1f5f9; font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #00d4ff; }
    input::placeholder { color: #475569; }
    input:disabled { opacity: .5; cursor: not-allowed; }

    #analyzeBtn {
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      border: none; border-radius: 9px; padding: 11px 18px;
      color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
      transition: opacity .2s;
    }
    #analyzeBtn:disabled { background: #1f2937; color: #64748b; cursor: not-allowed; }
    #analyzeBtn.done { background: linear-gradient(135deg, #10b981, #34d399); }

    .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .example-btn {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 3px 10px;
      color: #94a3b8; font-size: 11px; cursor: pointer;
      transition: all .2s;
    }
    .example-btn:hover { border-color: #00d4ff; color: #00d4ff; }

    /* Overall Progress */
    #overallProgress {
      background: #0f172a; border: 1px solid #1f2937;
      border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
      display: none;
    }
    .progress-header {
      display: flex; justify-content: space-between;
      margin-bottom: 6px; font-size: 12px;
    }
    .progress-label { color: #94a3b8; }
    .progress-pct { color: #00d4ff; font-weight: 700; font-size: 13px; }
    .progress-bar-bg {
      background: #1e293b; border-radius: 5px; height: 7px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 5px; width: 0%;
      background: linear-gradient(90deg, #00d4ff, #a855f7, #f59e0b, #10b981);
      transition: width .4s ease;
      box-shadow: 0 0 10px #00d4ff44;
    }

    /* Error */
    #errorBox {
      background: #ef444411; border: 1px solid #ef444433;
      border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
      color: #f87171; font-size: 13px; display: none;
    }

    /* Score */
    #scoreBox {
      border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
      display: none; align-items: center; gap: 12px;
    }
    .score-num { font-size: 30px; font-weight: 800; line-height: 1; }
    .score-title { font-weight: 700; font-size: 14px; }
    .score-sub { color: #64748b; font-size: 12px; }

    /* Agent Cards */
    .agents { display: flex; flex-direction: column; gap: 4px; }

    .agent-card {
      border-radius: 14px; padding: 16px;
      transition: all .3s; position: relative; overflow: hidden;
      border: 1px solid #1f2937; background: #0f172a;
    }
    .agent-card.active {
      border-color: var(--color);
      box-shadow: 0 0 22px color-mix(in srgb, var(--color) 17%, transparent);
      background: linear-gradient(135deg, #0f172a, #1a2540);
    }
    .agent-glow {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--color), transparent);
      animation: shimmer 1.5s infinite; display: none;
    }
    .agent-card.active .agent-glow { display: block; }

    .agent-header { display: flex; align-items: center; gap: 11px; }

    /* Ring */
    .ring-wrap { flex-shrink: 0; }

    .agent-icon {
      font-size: 20px; border-radius: 10px;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: color-mix(in srgb, var(--color) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--color) 20%, transparent);
    }
    .agent-info { flex: 1; }
    .agent-name { color: #f1f5f9; font-weight: 700; font-size: 14px; }
    .agent-sub { font-size: 11px; color: var(--color); }

    .agent-badge {
      border-radius: 20px; padding: 3px 10px;
      font-size: 11px; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .badge-dot-anim {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--color); animation: pulse 1s infinite; display: none;
    }

    .agent-prog-bar {
      background: #1e293b; border-radius: 4px; height: 4px;
      margin-top: 10px; overflow: hidden; display: none;
    }
    .agent-prog-fill {
      height: 100%; border-radius: 4px; width: 0%;
      transition: width .35s ease;
    }

    .agent-output {
      background: #060d1f; border-radius: 8px; padding: 12px;
      margin-top: 10px; font-size: 12.5px; color: #cbd5e1;
      line-height: 1.75; max-height: 200px; overflow-y: auto;
      white-space: pre-wrap; border: 1px solid #1e293b; display: none;
    }

    /* Arrow */
    .arrow { display: flex; justify-content: center; padding: 2px 0; }
    .arrow-inner { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .arrow-line { width: 2px; height: 6px; border-radius: 2px; background: #1f2937; transition: all .3s; }
    .arrow-head {
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-top: 6px solid #1f2937; transition: all .3s;
    }
    .arrow.on .arrow-line { background: var(--arrow-color); }
    .arrow.on .arrow-head { border-top-color: var(--arrow-color); }

    /* Done */
    #doneBox {
      margin-top: 16px; background: #0f172a;
      border: 1px solid #10b98133; border-radius: 12px;
      padding: 14px; text-align: center; display: none;
    }

    .footer { text-align: center; margin-top: 18px; color: #2d3748; font-size: 11px; }

    /* Spinner */
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid #475569; border-top-color: #00d4ff;
      border-radius: 50%; animation: spin .8s linear infinite;
      display: inline-block;
    }

    @keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes spin    { to{transform:rotate(360deg)} }
    @keyframes fadeIn  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div style="text-align:center; margin-bottom:22px">
    <div class="badge"><span class="badge-dot"></span> Multi-Agent AI · 4 Ajan</div>
    <h1>The Synthetic Merchant</h1>
    <p class="subtitle">Ürününüzü satmadan önce yapay zeka müşterilere test ettirin</p>
  </div>

  <!-- Input -->
  <div class="card">
    <label>🎯 Ürün Fikrinizi Girin</label>
    <div class="input-row">
      <input id="productInput" type="text" placeholder="Örn: Minimalist masa lambası..." />
      <button id="analyzeBtn" onclick="startAnalysis()">🚀 Analiz Et</button>
    </div>
    <div class="examples" id="examples">
      <button class="example-btn" onclick="setProduct('Minimalist masa lambası')">Minimalist masa lambası</button>
      <button class="example-btn" onclick="setProduct('El yapımı deri cüzdan')">El yapımı deri cüzdan</button>
      <button class="example-btn" onclick="setProduct('Bambu diş fırçası')">Bambu diş fırçası</button>
      <button class="example-btn" onclick="setProduct('Kedi şekilli silgi')">Kedi şekilli silgi</button>
    </div>
  </div>

  <!-- Error -->
  <div id="errorBox"></div>

  <!-- Overall Progress -->
  <div id="overallProgress">
    <div class="progress-header">
      <span class="progress-label" id="progressLabel">Başlatılıyor...</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Score -->
  <div id="scoreBox"></div>

  <!-- Agent Cards -->
  <div class="agents" id="agentCards"></div>

  <!-- Done -->
  <div id="doneBox">
    <div style="font-size:18px;margin-bottom:4px">🎯</div>
    <div style="color:#10b981;font-weight:700">Analiz Tamamlandı!</div>
    <div style="color:#64748b;font-size:12px;margin-top:3px">4 ajan çalıştı · Ürününüz optimize edildi · Satışa hazır</div>
  </div>

  <div class="footer">Powered by Groq + Llama 3.3 · The Synthetic Merchant v3.0</div>
</div>

<script>
const AGENTS = [
  { id: "scout",     name: "Trend Analisti",    subtitle: "Live Scout",         icon: "📡", color: "#00d4ff" },
  { id: "director",  name: "Yaratıcı Yönetmen", subtitle: "Creative Director",  icon: "🎨", color: "#a855f7" },
  { id: "consumer",  name: "Sanal Tüketici",    subtitle: "Consumer Simulator", icon: "🛒", color: "#f59e0b" },
  { id: "optimizer", name: "Revizyonist",        subtitle: "The Optimizer",      icon: "⚡", color: "#10b981" },
];

// SVG progress ring
function ringHTML(id, color) {
  const size = 46, r = (size-7)/2, circ = 2*Math.PI*r;
  return `
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)" class="ring-svg" data-id="${id}" data-circ="${circ}" data-r="${r}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1e293b" stroke-width="5.5"/>
      <circle class="ring-arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
        stroke="${color}" stroke-width="5.5"
        stroke-dasharray="0 ${circ}" stroke-linecap="round"
        style="transition:stroke-dasharray .35s ease"/>
      <text class="ring-txt"
        x="${size/2}" y="${size/2+0.5}"
        text-anchor="middle" dominant-baseline="middle"
        style="transform:rotate(90deg);transform-origin:${size/2}px ${size/2}px"
        fill="#4b5563" font-size="10" font-weight="700" font-family="Inter,sans-serif">—</text>
    </svg>`;
}

function buildCards() {
  const container = document.getElementById('agentCards');
  container.innerHTML = '';
  AGENTS.forEach((agent, i) => {
    // Card
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.id = `card-${agent.id}`;
    card.style.setProperty('--color', agent.color);
    card.innerHTML = `
      <div class="agent-glow"></div>
      <div class="agent-header">
        <div class="ring-wrap">${ringHTML(agent.id, agent.color)}</div>
        <div class="agent-icon">${agent.icon}</div>
        <div class="agent-info">
          <div class="agent-name">${agent.name}</div>
          <div class="agent-sub">${agent.subtitle}</div>
        </div>
        <div class="agent-badge" id="badge-${agent.id}"
          style="background:${agent.color}1a;color:#374151;border:1px solid #37415133">
          Bekliyor
        </div>
      </div>
      <div class="agent-prog-bar" id="progbar-${agent.id}">
        <div class="agent-prog-fill" id="progfill-${agent.id}"
          style="background:linear-gradient(90deg,${agent.color}88,${agent.color})"></div>
      </div>
      <div class="agent-output" id="output-${agent.id}"></div>
    `;
    container.appendChild(card);

    // Arrow (except last)
    if (i < AGENTS.length - 1) {
      const next = AGENTS[i+1];
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.id = `arrow-${i}`;
      arrow.style.setProperty('--arrow-color', next.color);
      arrow.innerHTML = `
        <div class="arrow-inner">
          <div class="arrow-line"></div>
          <div class="arrow-line" style="opacity:.7"></div>
          <div class="arrow-line" style="opacity:.4"></div>
          <div class="arrow-head"></div>
        </div>`;
      container.appendChild(arrow);
    }
  });
}

function setRing(id, pct, color) {
  const svg = document.querySelector(`.ring-svg[data-id="${id}"]`);
  if (!svg) return;
  const circ = parseFloat(svg.dataset.circ);
  const arc = svg.querySelector('.ring-arc');
  const txt = svg.querySelector('.ring-txt');
  const dash = (pct/100)*circ;
  arc.setAttribute('stroke-dasharray', `${dash} ${circ}`);
  arc.setAttribute('stroke', pct===100 ? '#10b981' : color);
  txt.textContent = pct===100 ? '✓' : pct>0 ? `${pct}%` : '—';
  txt.setAttribute('fill', pct===100 ? '#10b981' : pct>0 ? color : '#4b5563');
  txt.setAttribute('font-size', pct===100 ? '11' : '10');
}

function setAgentStatus(id, status) {
  const agent = AGENTS.find(a => a.id === id);
  const card  = document.getElementById(`card-${id}`);
  const badge = document.getElementById(`badge-${id}`);
  const progbar = document.getElementById(`progbar-${id}`);

  const statMap = {
    idle:    { label: 'Bekliyor',     color: '#374151' },
    waiting: { label: 'Sırada',       color: '#6b7280' },
    running: { label: 'Çalışıyor...', color: agent.color },
    done:    { label: 'Tamamlandı',   color: '#10b981' },
  };
  const s = statMap[status];

  badge.textContent = s.label;
  badge.style.color = s.color;
  badge.style.background = s.color + '1a';
  badge.style.borderColor = s.color + '33';

  if (status === 'running') {
    card.classList.add('active');
    progbar.style.display = 'block';
  } else {
    card.classList.remove('active');
  }

  // Arrow before this agent
  const idx = AGENTS.findIndex(a => a.id === id);
  if (idx > 0) {
    const arrow = document.getElementById(`arrow-${idx-1}`);
    if (arrow && (status === 'running' || status === 'done')) {
      arrow.classList.add('on');
    }
  }
}

function setAgentProg(id, pct) {
  const color = AGENTS.find(a => a.id === id)?.color;
  const fill  = document.getElementById(`progfill-${id}`);
  if (fill) {
    fill.style.width = pct + '%';
    if (pct === 100) fill.style.background = 'linear-gradient(90deg,#10b981,#34d399)';
  }
  setRing(id, pct, color);
}

function setAgentOutput(id, text) {
  const el = document.getElementById(`output-${id}`);
  if (el) { el.style.display = 'block'; el.textContent = text; el.scrollTop = el.scrollHeight; }
}

let tickers = {};
function startTicker(id) {
  let fake = 8;
  setAgentProg(id, fake);
  tickers[id] = setInterval(() => {
    fake = Math.min(fake + Math.random()*6+2, 88);
    setAgentProg(id, Math.round(fake));
    updateOverall();
  }, 500);
}
function stopTicker(id) {
  clearInterval(tickers[id]);
}

let agentProgs = { scout:0, director:0, consumer:0, optimizer:0 };

function updateOverall() {
  const fills = ['scout','director','consumer','optimizer'].map(id => {
    const el = document.getElementById(`progfill-${id}`);
    return el ? parseFloat(el.style.width||'0') : 0;
  });
  const avg = Math.round(fills.reduce((a,b)=>a+b,0)/4);
  document.getElementById('progressPct').textContent = avg + '%';
  document.getElementById('progressFill').style.width = avg + '%';
}

function setProduct(val) { document.getElementById('productInput').value = val; }

async function startAnalysis() {
  const product = document.getElementById('productInput').value.trim();
  if (!product) return;

  // Reset UI
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('analyzeBtn').innerHTML = '<span class="spinner"></span> Analiz...';
  document.getElementById('productInput').disabled = true;
  document.getElementById('examples').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('scoreBox').style.display = 'none';
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('overallProgress').style.display = 'block';

  buildCards();
  AGENTS.forEach(a => setAgentStatus(a.id, 'waiting'));

  try {
    // Start all tickers visually for running agent
    const agentIds = ['scout','director','consumer','optimizer'];

    // Set scout running
    setAgentStatus('scout', 'running');
    startTicker('scout');
    document.getElementById('progressLabel').textContent = 'Trend Analisti çalışıyor...';

    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Sunucu hatası');
    }

    const data = await res.json();

    // Animate results one by one
    stopTicker('scout');
    setAgentProg('scout', 100);
    setAgentStatus('scout', 'done');
    setAgentOutput('scout', data.scout);
    updateOverall();
    await sleep(300);

    setAgentStatus('director', 'running');
    startTicker('director');
    document.getElementById('progressLabel').textContent = 'Yaratıcı Yönetmen çalışıyor...';
    await sleep(800);
    stopTicker('director');
    setAgentProg('director', 100);
    setAgentStatus('director', 'done');
    setAgentOutput('director', data.director);
    updateOverall();
    await sleep(300);

    setAgentStatus('consumer', 'running');
    startTicker('consumer');
    document.getElementById('progressLabel').textContent = 'Sanal Tüketici çalışıyor...';
    await sleep(800);
    stopTicker('consumer');
    setAgentProg('consumer', 100);
    setAgentStatus('consumer', 'done');
    setAgentOutput('consumer', data.consumer);
    updateOverall();
    await sleep(300);

    setAgentStatus('optimizer', 'running');
    startTicker('optimizer');
    document.getElementById('progressLabel').textContent = 'Revizyonist çalışıyor...';
    await sleep(800);
    stopTicker('optimizer');
    setAgentProg('optimizer', 100);
    setAgentStatus('optimizer', 'done');
    setAgentOutput('optimizer', data.optimizer);
    updateOverall();

    // Score
    const m = data.consumer.match(/SKOR:\s*(\d+)\/10/i) || data.consumer.match(/(\d+)\/10/);
    if (m) showScore(parseInt(m[1]));

    // Done
    document.getElementById('progressLabel').textContent = '✅ Tüm ajanlar tamamlandı';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressPct').textContent = '100%';
    document.getElementById('progressFill').style.boxShadow = 'none';
    document.getElementById('doneBox').style.display = 'block';

    // Reset button
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = false;
    btn.className = 'done';
    btn.innerHTML = '🔄 Yenile';
    btn.onclick = resetApp;

  } catch(e) {
    Object.values(tickers).forEach(t => clearInterval(t));
    document.getElementById('errorBox').textContent = '⚠️ ' + e.message;
    document.getElementById('errorBox').style.display = 'block';
    resetBtn();
  }
}

function showScore(score) {
  const box = document.getElementById('scoreBox');
  const color = score>=7 ? '#10b981' : score>=5 ? '#f59e0b' : '#ef4444';
  const label = score>=7 ? '✅ Müşteri Onayı Alındı!' : score>=5 ? '⚠️ Optimizasyon Gerekiyor' : '❌ Yeniden Tasarlanmalı';
  box.style.background = color + '15';
  box.style.border = `1px solid ${color}33`;
  box.style.display = 'flex';
  box.innerHTML = `
    <div class="score-num" style="color:${color}">${score}/10</div>
    <div>
      <div class="score-title">${label}</div>
      <div class="score-sub">Sanal müşteri simülasyonu skoru</div>
    </div>`;
}

function resetBtn() {
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = false;
  btn.className = '';
  btn.innerHTML = '🚀 Analiz Et';
  btn.onclick = startAnalysis;
  document.getElementById('productInput').disabled = false;
}

function resetApp() {
  document.getElementById('productInput').value = '';
  document.getElementById('productInput').disabled = false;
  document.getElementById('examples').style.display = 'flex';
  document.getElementById('overallProgress').style.display = 'none';
  document.getElementById('scoreBox').style.display = 'none';
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('agentCards').innerHTML = '';
  resetBtn();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Enter key
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('productInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startAnalysis();
  });
  buildCards();
});
</script>
</body>
</html>
